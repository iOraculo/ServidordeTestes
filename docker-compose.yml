services:
  db:
    image: mariadb:11.4
    container_name: aureumro-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-aureumro_root_pass}
      MARIADB_DATABASE: ${DB_NAME:-ragnarok}
      MARIADB_USER: ${DB_USER:-ragnarok}
      MARIADB_PASSWORD: ${DB_PASSWORD:-aureumro_db_pass}
      TZ: America/Sao_Paulo
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --sql-mode=NO_ENGINE_SUBSTITUTION
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  rathena:
    build:
      context: .
      dockerfile: docker/rathena/Dockerfile
      args:
        RATHENA_GIT_REF: ${RATHENA_GIT_REF:-master}
        RATHENA_PACKETVER: ${RATHENA_PACKETVER:-20220406}
        RATHENA_DISABLE_OBFUSCATION: ${RATHENA_DISABLE_OBFUSCATION:-1}
        RATHENA_MAKE_JOBS: ${RATHENA_MAKE_JOBS:-2}
    container_name: aureumro-rathena
    restart: unless-stopped
    stop_grace_period: 5s
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: America/Sao_Paulo
      SERVER_NAME: ${SERVER_NAME:-AureumRO Testes}
      SERVER_PUBLIC_IP: ${SERVER_PUBLIC_IP:-127.0.0.1}
      SERVER_PRESET: ${SERVER_PRESET:-sandbox}
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-ragnarok}
      DB_USER: ${DB_USER:-ragnarok}
      DB_PASSWORD: ${DB_PASSWORD:-aureumro_db_pass}
      INTER_SERVER_USER: ${INTER_SERVER_USER:-s1}
      INTER_SERVER_PASS: ${INTER_SERVER_PASS:-p1}
      GM_ADMIN_USER: ${GM_ADMIN_USER:-admin}
      GM_ADMIN_PASS: ${GM_ADMIN_PASS:-admin123}
      TESTER_USER: ${TESTER_USER:-tester}
      TESTER_PASS: ${TESTER_PASS:-tester123}
      LOGIN_PORT: ${LOGIN_PORT:-6900}
      CHAR_PORT: ${CHAR_PORT:-6121}
      MAP_PORT: ${MAP_PORT:-5121}
    ports:
      - "${LOGIN_PORT:-6900}:6900"
      - "${CHAR_PORT:-6121}:6121"
      - "${MAP_PORT:-5121}:5121"
    volumes:
      - ./config:/aureumro/config:ro
      - ./npc:/aureumro/npc:ro
      - ./db:/aureumro/db:ro
      - ./docker/db:/aureumro/db-seed:ro
      - rathena_logs:/rathena/log
      - rathena_state:/aureumro/state
    healthcheck:
      test: ["CMD", "/usr/local/bin/rathena-healthcheck.sh"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  webpanel:
    build:
      context: ./webpanel
      dockerfile: Dockerfile
    container_name: aureumro-webpanel
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: America/Sao_Paulo
      PORT: 8080
      SERVER_NAME: ${SERVER_NAME:-AureumRO Testes}
      SERVER_PUBLIC_IP: ${SERVER_PUBLIC_IP:-127.0.0.1}
      SERVER_PRESET: ${SERVER_PRESET:-sandbox}
      RATHENA_PACKETVER: ${RATHENA_PACKETVER:-20220406}
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-ragnarok}
      DB_USER: ${DB_USER:-ragnarok}
      DB_PASSWORD: ${DB_PASSWORD:-aureumro_db_pass}
      RATHENA_HOST: rathena
      LOGIN_PORT: ${LOGIN_PORT:-6900}
      CHAR_PORT: ${CHAR_PORT:-6121}
      MAP_PORT: ${MAP_PORT:-5121}
      WEBPANEL_ALLOW_REGISTRATION: ${WEBPANEL_ALLOW_REGISTRATION:-true}
      PRESET_STATE_FILE: /aureumro/state/active_preset
      RATHENA_LOG_DIR: /rathena/log
    ports:
      - "${WEBPANEL_PORT:-8080}:8080"
    volumes:
      - rathena_state:/aureumro/state
      - rathena_logs:/rathena/log:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  db_data:
  rathena_logs:
  rathena_state:
