; =============================================================================
; AureumRO - Configuracao dgVoodoo2 otimizada para Ragnarok Online (DX7 -> DX11)
; Ativa Anisotropic Filtering 16x + MSAA 4x em TODOS os mapas do jogo sem
; marca d'agua e preservando a resolucao escolhida no opensetup.exe.
; =============================================================================

Version = 0x283

[General]
OutputAPI = bestavailable
Adapters = all
FullScreenOutput = default
FullScreenMode = false
ScalingMode = unspecified
ProgressiveScanlineOrder = false
EnumerateRefreshRates = false
Brightness = 100
Color = 100
Contrast = 100
InheritColorProfileInFullScreenMode = true
KeepWindowAspectRatio = true
CaptureMouse = false
CenterAppWindow = true
DisableScreenSaver = true

[GeneralExt]
DesktopResolution =
DesktopBitDepth =
DeframerSize = 1
ImageScaleFactor = 1
CursorScaleFactor = 0
DisplayROI =
Resampling = bilinear
PresentationModel = auto
ColorSpace = appdriven
FreeMouse = false
WindowedAttributes =
FullscreenAttributes =
FPSLimit = 0
Environment =
SystemHookFlags =

[DirectX]
DisableAndPassThru = false
VideoCard = dgVoodoo Virtual 3D Accelerated Card
VRAM = 1024
Filtering = 16
DisableMipmapping = false
Resolution = unforced
Antialiasing = 4x
AppControlledScreenMode = true
DisableAltEnterToToggleScreenMode = false
Bilinear2DOperations = false
PhongShadingWhenPossible = false
ForceVerticalSync = false
dgVoodooWatermark = false
FastVideoMemoryAccess = true

[DirectXExt]
AdapterIDType =
VendorID = 0x0
DeviceID = 0x0
SubsystemID = 0x0
RevisionID = 0x0
DefaultEnumeratedResolutions = all
ExtraEnumeratedResolutions =
EnumeratedResolutionBitdepths = all
DitheringEffect = pure32bit
Dithering = forcealways
DitherOrderedMatrixSizeScale = 0
DepthBuffersBitDepth = appdriven
Default3DRenderFormat = argb8888
MaxVSConstRegisters = 256
NPatchTesselationLevel = 0
DisplayOutputEnableMask = 0xffffffff
MSD3DDeviceNames = false
RTTexturesForceScaleAndMSAA = true
SmoothedDepthSampling = true
DeferredScreenModeSwitch = false
PrimarySurfaceBatchedUpdate = false
SuppressAMDShaderPrecompilation = false

[Debug]
Info = disable
Warning = disable
Error = disable
MaxTraceLevel = 0
LogToFile = false
